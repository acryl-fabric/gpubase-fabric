name: 테스트베드 사용 요청 (Testbed request)
description: 아크릴 RoCEv2 GPU 클러스터 테스트베드에서 실험·검증을 요청합니다. (컨소시엄 참여기관용)
title: "[Testbed] "
labels: ["type/testbed", "area/field-test", "status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        **공개 저장소입니다.** 접속 정보(IP, 계정, 키)는 이슈에 적지 말고, 승인 후 아크릴 담당자가 별도 채널로 전달합니다.
  - type: dropdown
    id: org
    attributes:
      label: 요청 기관
      options: ["아크릴", "연세대", "성균관대", "아주대", "망고부스트", "외부"]
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 실험 목적과 관련 산출물
      placeholder: "예: 1차 산출물 '병목 원인 분류 모듈' 검증"
    validations:
      required: true
  - type: textarea
    id: resources
    attributes:
      label: 필요 자원
      description: GPU 노드 수, NIC/DPU, 스위치 구성, 필요 권한(노드 root, 스위치 설정 변경 등)
    validations:
      required: true
  - type: input
    id: period
    attributes:
      label: 희망 기간
      placeholder: "2026-11-10 ~ 2026-11-14"
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 장비 영향
      description: 스위치 설정 변경, 재부팅, 펌웨어 변경처럼 다른 사용자에게 영향을 주는 작업이 있나요?
