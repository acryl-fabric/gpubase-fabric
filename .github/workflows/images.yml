name: images

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: detect changed deployable components
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.detect.outputs.components }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            components="$(hack/changed-components.sh "$BEFORE" "$AFTER" --deployable)"
          else
            components="$(bash -c 'source hack/lib.sh; list_deployable_components' | jq -R . | jq -cs .)"
          fi
          echo "components=$components" >> "$GITHUB_OUTPUT"
          echo "deployable components to publish: $components"

  publish:
    name: publish ${{ matrix.component }}
    needs: changes
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        env:
          COMPONENT: ${{ matrix.component }}
        run: echo "name=$(basename "$COMPONENT")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          push: true
          build-args: VERSION=main-${{ github.sha }}
          tags: |
            ghcr.io/acryl-fabric/gpubase-fabric/${{ steps.meta.outputs.name }}:${{ github.sha }}
            ghcr.io/acryl-fabric/gpubase-fabric/${{ steps.meta.outputs.name }}:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
