# gitleaks configuration: default rules + internal network exposure.
title = "gpubase-fabric"

[extend]
useDefault = true

# Real private IPv4 host addresses must not be committed (CLAUDE.md, review criterion 7).
# Use placeholders (<NODE_IP>) or documentation ranges (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24).
[[rules]]
id = "private-ipv4-address"
description = "Private IPv4 host address (possible internal infrastructure exposure)"
regex = '''\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'''
tags = ["internal", "network"]
  # Network/CIDR notation such as 10.0.0.0/8 or 10.244.0.0/16 describes ranges, not hosts.
  [[rules.allowlists]]
  regexTarget = "line"
  regexes = ['''\b(10|172|192)\.\d{1,3}\.\d{1,3}\.0/\d{1,2}\b''']
